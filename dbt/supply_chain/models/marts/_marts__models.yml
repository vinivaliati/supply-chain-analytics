version: 2

models:
  - name: dim_date
    description: "Dimensão de datas cobrindo o período de simulação (2024), com atributos de calendário."
    columns:
      - name: date_day
        tests:
          - unique
          - not_null

  - name: dim_products
    description: "Dimensão de produtos, com a curva ABC atual vinda do snapshot SCD2."
    columns:
      - name: sku_id
        tests:
          - unique
          - not_null
      - name: supplier_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_suppliers')
                field: supplier_id

  - name: dim_suppliers
    description: "Dimensão de fornecedores."
    columns:
      - name: supplier_id
        tests:
          - unique
          - not_null

  - name: dim_warehouses
    description: "Dimensão de centros de distribuição."
    columns:
      - name: warehouse_id
        tests:
          - unique
          - not_null

  - name: dim_stores
    description: "Dimensão de lojas, com o CD abastecedor já resolvido."
    columns:
      - name: store_id
        tests:
          - unique
          - not_null
      - name: warehouse_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_warehouses')
                field: warehouse_id

  - name: fct_otif
    description: "Fato de OTIF: um registro por pedido de venda, com flags de in_full, on_time e otif."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: sku_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: sku_id
      - name: store_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stores')
                field: store_id
      - name: warehouse_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_warehouses')
                field: warehouse_id

  - name: fct_inventory_daily
    description: "Fato de estoque diário por SKU/CD, com cobertura em dias e flags de risco."
    columns:
      - name: sku_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: sku_id
      - name: warehouse_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_warehouses')
                field: warehouse_id
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - snapshot_date
              - sku_id
              - warehouse_id

  - name: fct_stockouts
    description: "Fato de eventos de ruptura, com receita perdida estimada."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: sku_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: sku_id
      - name: estimated_lost_revenue
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

  - name: fct_transit_performance
    description: "Fato de desempenho de transporte (CD -> loja), por transportadora e rota."
    columns:
      - name: shipment_id
        tests:
          - unique
          - not_null
      - name: warehouse_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_warehouses')
                field: warehouse_id
      - name: store_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stores')
                field: store_id