name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: supply_chain
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-retries 10
    env:
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: supply_chain
      SUPPLY_CHAIN_DB_HOST: localhost
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # o passo do dbt compara os arquivos do PR com a branch base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r data_generator/requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: python -m data_generator.main
      - run: python -m data_generator.load_to_postgres
      - run: dbt deps
        working-directory: dbt/supply_chain
      - run: sqlfluff lint dbt/supply_chain/models
      # Em PR que so mexe em dbt/supply_chain, constroi so o que mudou (com pais e filhos),
      # comparando com o manifest da main publicado junto com a documentacao.
      # Qualquer outro caso (gerador, requirements, sem manifest) faz o build completo.
      - name: dbt build
        working-directory: dbt/supply_chain
        run: |
          # verdadeiro so se todos os arquivos alterados (um por linha no stdin) estao em dbt/supply_chain/
          only_dbt_changed() {
            files=$(cat)
            [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '^dbt/supply_chain/'
          }
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             git diff --name-only "origin/${{ github.base_ref }}...HEAD" | only_dbt_changed && \
             curl -fsS "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/manifest.json" \
               -o /tmp/state/manifest.json --create-dirs; then
            dbt build --select "+state:modified+" --state /tmp/state
          else
            dbt build
          fi
      - name: Gera a documentacao do dbt (so na main)
        if: github.ref == 'refs/heads/main'
        working-directory: dbt/supply_chain
        run: |
          dbt docs generate
          mkdir -p ../../site
          cp target/index.html target/manifest.json target/catalog.json ../../site/
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-docs:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
